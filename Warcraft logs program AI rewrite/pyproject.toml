[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warcraft-logs"
version = "0.1.0"
description = "Modernised local World of Warcraft raid analysis toolkit"
requires-python = ">=3.11"
authors = [{name = "AscendedHobo"}]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pillow>=9.0",
    "tkinterdnd2>=0.3.0",
]

[project.optional-dependencies]
develop = [
    "pytest>=7.0",
]

[project.scripts]
warcraft-raid-analysis = "warcraft_logs.__main__:main"
